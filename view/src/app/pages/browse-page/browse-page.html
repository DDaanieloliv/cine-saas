<main class="container" id="">
  <app-browse-tabs
    (tabOption)="updateTabOptionSelected($event)"
  />

  <app-browse-filters
    [preset]="preset"
    [searchStr]="searchStr"
    (searchContentChange)="updateBySearch($event)"
    (selectedCountry)="updateByCountry($event)"
    (selectedGenre)="updateByGenre($event)"
    (selectedLanguage)="updateByLanguage($event)"
    (selectedDecade)="updateByDecade($event)"
    (isChoosedByEditor)="updateChoosedByEditor($event)"
    (selectedYearOrder)="updateYearDescendin($event)"
  />

    <app-poster-grid
      [tabSelectedOption]="tabSelected"
      [matchBySearch]="matchBySearch"
      [matchByCountry]="matchByCountry"
      [matchByGenre]="matchByGenre"
      [matchByLanguage]="matchByLanguage"
      [matchByDecade]="matchByDecade"
      [isChoosedByEditor]="isChoosedByEditor"
      [yearDescendin]="yearDescendin"
    />
</main>
