<div class="poster_grid" id="">

  @for (poster of posters; track poster.id) {
    <a class="poster_card" href="">
      <div class="poster_card_image" id="">
        <picture class="picture"></picture>
        <span class="poster_card_type">{{poster.type}}</span>
      </div>
      <div class="poster_card_info" id="">
        <p class="poster_card_title">{{poster.poster_title}}</p>
        <p class="poster_card_meta">{{poster.countries}} · {{poster.year}}</p>
      </div>
    </a>
  }

</div>
