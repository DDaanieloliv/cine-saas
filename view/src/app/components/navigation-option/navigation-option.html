@for (option of options; track option.id) {
  <a
    [routerLink]="'/' +  option.name.toLowerCase()"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{
      paths: 'exact',
      queryParams: 'ignored',
      matrixParams: 'ignored',
      fragment: 'ignored'
    }"
    class="option_looking"
  >
    {{option.name}}
  </a>
}
