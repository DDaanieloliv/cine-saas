<div class="browse_filters" id="">
  <input class="filter_search" type="" name="search" value="Search...">
  <div class="search_settings" id="">
    @for (filter of filter_select; track filter.id) {

      <select>
        @for (option of filter.options; track option.id) {
        <option value="{{option.option}}">{{option.option}}</option>
        }
      </select>
    }
    <button
      (click)="showClearButtom()"
      type="button"
      class="regular-btn btn btn-primary"
      >
      Most Desired Picks
    </button>
    <button
      type="button"
      (click)="showClearButtom()"
      class="clear_option"
      [class.regular-btn]="shouldClearFilters"
      [class.btn]="shouldClearFilters"
      [class.btn-primary]="shouldClearFilters"
      >
      ✕ Clear
    </button>
    <div class="spacing" id=""></div>
    <label for="">  Sort By
      <select>
        <option value="year">Year ↓</option>
        <option value="year">Year ↑</option>
      </select>
    </label>
  </div>
  <p>N° titles</p>
</div>
