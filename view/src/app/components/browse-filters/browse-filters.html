<div class="browse_filters" id="">
  <input
    #searchElement
    class="filter_search"
    type=""
    name="search"
    placeholder="Search..."
    (input)="contentSearch(searchElement.value)"
  >
  <div class="search_settings" id="">
    @for (filter of filter_select; track filter.id) {
      <select #selectElement
        (change)="filterChange(filter.filter_name, selectElement.value)"
      >
        @for (option of filter.options; track option.id) {
        <option
          value="{{option.option}}"
        >
          {{option.option}}
        </option>
        }
      </select>
    }
    <button
      (click)="showClearButtom()"
      type="button"
      class="regular-btn btn btn-primary"
      >
      Most Desired Picks
    </button>
    <button
      type="button"
      (click)="showClearButtom()"
      class="clear_option"
      [class.regular-btn]="shouldClearFilters"
      [class.btn]="shouldClearFilters"
      [class.btn-primary]="shouldClearFilters"
      >
      ✕ Clear
    </button>
    <div class="spacing" id=""></div>
    <label for="">  Sort By
      <select>
        <option value="desc">Year ↓</option>
        <option value="asc">Year ↑</option>
      </select>
    </label>
  </div>
  <p>N° titles</p>
</div>
